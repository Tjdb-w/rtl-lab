[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-lab"
version = "0.1.0"
description = "Hardware simulation and RTL verification framework (Icarus Verilog)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RTL Lab" }]

[project.scripts]
rtl-lab = "rtl_lab.cli:main"

[tool.setuptools]
packages = ["rtl_lab"]
